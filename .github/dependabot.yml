version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    # Monthly, not weekly: actions are SHA-pinned, so routine bumps are hygiene
    # rather than security fixes, and weekly PRs were mostly noise. Security
    # alerts still arrive immediately, independent of this schedule.
    schedule:
      interval: "monthly"
    # Bundle all action updates into a single monthly PR instead of one per action
    groups:
      github-actions:
        patterns: ["*"]
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore"

  - package-ecosystem: "pip"
    directory: "/scripts"
    schedule:
      interval: "monthly"
    groups:
      scripts:
        patterns: ["*"]
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore"

  - package-ecosystem: "npm"
    directory: "/landing"
    schedule:
      interval: "monthly"
    groups:
      landing:
        patterns: ["*"]
    ignore:
      # @astrojs/check (latest: 0.9.12) peers on TypeScript ^5 || ^6, so a
      # TypeScript 7 bump breaks `npm ci`. Remove once the checker accepts 7.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore"
