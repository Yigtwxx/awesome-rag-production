name: Deploy Site (GitHub Pages)

on:
  push:
    branches: [main]
    paths:
      - '**/*.md'
      - 'docs-site/**'
      - 'landing/**'
      - 'scripts/site_stats.py'
      - 'scripts/entry_patterns.py'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - '**/*.md'
      - 'docs-site/**'
      - 'landing/**'
      - 'scripts/site_stats.py'
      - 'scripts/entry_patterns.py'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment; let an in-progress run finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: the landing page plots the list's growth from git.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      # Cairo/Pillow native libs required by the mkdocs-material `social` plugin
      # to render Open Graph / Twitter card images.
      - name: Install Cairo/Pillow system libs (social cards)
        run: sudo apt-get update && sudo apt-get install -y libcairo2-dev libfreetype6-dev libffi-dev libjpeg-dev libpng-dev libz-dev pngquant

      - name: Install Dependencies
        run: pip install -r docs-site/requirements.txt

      - name: Stage Docs
        run: bash docs-site/stage_docs.sh

      - name: Build Docs (mkdocs, served under /docs/)
        run: mkdocs build -f docs-site/mkdocs.yml --verbose
        env:
          # Public analytics token; overrides/main.html adds the beacon when set.
          CF_WEB_ANALYTICS_TOKEN: ${{ vars.CF_WEB_ANALYTICS_TOKEN }}

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: landing/package-lock.json

      - name: Install Landing Dependencies
        working-directory: landing
        run: npm ci

      - name: Check Landing (astro check, tsc, prettier)
        working-directory: landing
        run: npm run check

      - name: Build Landing (Astro, served at /)
        working-directory: landing
        env:
          # Read-only token only raises the GitHub API rate limit for the star count.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Public site token for Cloudflare Web Analytics; empty = no beacon.
          PUBLIC_CF_BEACON_TOKEN: ${{ vars.CF_WEB_ANALYTICS_TOKEN }}
        run: npm run build

      - name: Assemble Site
        run: |
          mkdir -p _site/docs
          cp -r landing/dist/. _site/
          cp -r docs-site/site/. _site/docs/

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        with:
          enablement: true

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    # PRs build the site but never publish it. Guarding on `github.ref` alone was
    # not enough: a run that leaves the queue after its PR has merged no longer
    # resolves `refs/pull/N/merge` and the job fails instead of skipping, which
    # is how a red `deploy` check landed on an already-merged PR during the
    # 2026-08-26 Actions incident. `workflow_dispatch` stays able to deploy so a
    # missed push run can still be replayed by hand.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: https://yigtwxx.github.io/awesome-rag-production/
    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
