name: Weekly RAG Discovery

on:
  schedule:
    # Every Monday at 06:00 UTC (09:00 Istanbul time, UTC+3).
    - cron: '0 6 * * 1'
  workflow_dispatch: # Also triggerable manually via the Actions UI.

jobs:
  discover:
    runs-on: ubuntu-latest
    permissions:
      contents: read      # checkout only
      issues: write       # post discovery comment on tracking issue

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run Discovery Engine
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/discovery_engine.py

      - name: Post Results to Tracking Issue
        # Always post, even when the engine exits non-zero. The script writes a
        # failure note into the report on request errors, and a partial report
        # beats silently losing the whole week's audit.
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          REPORT_FILE=".github/PROPOSED_UPDATES.md"
          if [ ! -f "$REPORT_FILE" ]; then
            echo "No report file found — discovery may have failed. Check logs."
            exit 0
          fi

          # shellcheck source=.github/scripts/tracking-issue.sh
          . .github/scripts/tracking-issue.sh

          cat > /tmp/feed-seed.md <<'SEED'
          This issue receives automated weekly RAG discovery results. Each Monday a
          new comment is added with trending repositories, stale listed tools, and
          any stale benchmark citations detected in `benchmarks.md`.
          SEED

          ISSUE_NUM=$(find_or_create_tracking_issue \
            "discovery-feed" \
            "Weekly RAG Discovery Feed" \
            /tmp/feed-seed.md \
            "Long-lived issue receiving weekly RAG discovery results")

          gh issue comment "$ISSUE_NUM" \
            --repo "$GH_REPO" \
            --body-file "$REPORT_FILE"
